scanner:
    max_file_size: 2097152
    include_tests: false
    include_configs: true
    include_markup: false
    include_styles: false
    include_docs: false
    excluded_patterns:
        - .gitignore
        - .DS_Store
        - Thumbs.db
        - '*.log'
        - '*.tmp'
        - '*.bak'
        - vendor/**
        - '*.exe'
        - '*.dll'
        - '*.so'
        - '*.dylib'
        # Служебные файлы и папки утилит
        - .gops/**
        - .claude/**
        - gops_config*.yaml
        - go.sum
        - package-lock.json
        - yarn.lock
        - pnpm-lock.yaml
        - node_modules/**
        - .git/**
        - .idea/**
        - .vscode/**
        - dist/**
        - build/**
        - coverage/**
        - .nyc_output/**
        - .angular/**
        - .nx/**
    parallel_workers: 4
    timeout: 5m0s
output:
    format: markdown
    filename: project_docs.md
    append_timestamp: true
